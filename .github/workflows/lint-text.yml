name: lint-text
on:
  pull_request:
    paths:
      - "**/*.md"
jobs:
  textlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -D textlint textlint-rule-write-good textlint-rule-no-start-duplicated-conjunction
      - run: npx textlint "**/*.md"

